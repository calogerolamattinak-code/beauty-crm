    <!-- FAQ Schema (10 domande per GEO) -->
    <script type="application/ld+json" id="faq-schema">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Beauty CRM è davvero gratis?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sì! Il piano Free è gratis per sempre, con fino a 30 clienti e tutte le funzioni principali. Nessuna carta di credito richiesta."
          }
        },
        {
          "@type": "Question",
          "name": "Come funzionano i promemoria WhatsApp?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Con il piano Premium (9,90€/mese), il sistema invia automaticamente un messaggio WhatsApp ai clienti 24 ore prima dell'appuntamento, riducendo le mancate presenze fino al 50%."
          }
        },
        {
          "@type": "Question",
          "name": "Beauty CRM funziona su telefono?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sì, Beauty CRM è ottimizzato per mobile e funziona direttamente dal browser senza scaricare app. Funziona anche su tablet e computer."
          }
        },
        {
          "@type": "Question",
          "name": "I miei dati sono al sicuro?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sì. I dati sono archiviati su server Google Firebase con crittografia. Ogni utente vede solo i propri dati, protetti da autenticazione Google."
          }
        },
        {
          "@type": "Question",
          "name": "Posso disdire il Premium quando voglio?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sì, non ci sono vincoli. Puoi passare dal piano Premium al piano Free in qualsiasi momento, mantenendo tutti i tuoi dati."
          }
        },
        {
          "@type": "Question",
          "name": "Posso importare i miei clienti esistenti?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sì, puoi aggiungere manualmente i tuoi clienti in pochi secondi dalla sezione Clienti. Stiamo lavorando all'importazione massiva da Excel e CSV."
          }
        },
        {
          "@type": "Question",
          "name": "Come si cancellano gli appuntamenti?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Puoi cancellare un appuntamento con un clic dalla sezione Agenda. Il cliente riceve automaticamente una notifica di cancellazione."
          }
        },
        {
          "@type": "Question",
          "name": "Posso avere più di un operatore?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sì! Con il piano Premium puoi gestire più operatori nel tuo salone. Ogni operatore ha la propria agenda e i clienti prenotano con l'operatore specifico."
          }
        },
        {
          "@type": "Question",
          "name": "Si può usare su tablet?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Certamente! Beauty CRM è ottimizzato per tablet, smartphone e computer con interfaccia responsive che si adatta a ogni schermo."
          }
        },
        {
          "@type": "Question",
          "name": "Accettate bonifico?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Per il Premium accettiamo carte di credito/debito e PayPal. Il bonifico bancario è disponibile per piani annuali o soluzioni business personalizzate."
          }
        }
      ]
    }
