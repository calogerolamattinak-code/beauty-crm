name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-build:
    name: Lint + Typecheck + Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Lint: report-only per ora (26 errori di strictness dei nuovi plugin
      # react-hooks v7 / typescript-eslint — da bonificare incrementalmente,
      # poi togliere continue-on-error per renderlo bloccante)
      - name: Lint
        run: npm run lint
        continue-on-error: true

      # Build con env placeholder: verifica compilazione TypeScript + bundle Vite.
      # I valori Firebase reali servono solo nel workflow di deploy.
      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ci-placeholder
          VITE_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "0"
          VITE_FIREBASE_APP_ID: 1:0:web:ci-placeholder
          VITE_FIREBASE_MEASUREMENT_ID: G-CIPLACEHOLDER
